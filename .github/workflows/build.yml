name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-22.04,
            ubuntu-24.04,
            windows-2025,
            windows-2022,
            macos-26,
            macos-15,
            macos-14,
          ]
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v5
      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
        continue-on-error: ${{ matrix.toolchain != 'stable' }}
      - name: Run
        if: runner.os == 'macOS'
        run: cargo run
        continue-on-error: ${{ matrix.toolchain != 'stable' }}

  msrv:
    name: msrv (macos-latest, 1.61.0)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install 1.61.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.61.0
      - uses: Swatinem/rust-cache@v2
      - name: Build and run
        run: cargo run --locked

  clippy:
    name: clippy (macos-latest, stable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: fmt (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check
